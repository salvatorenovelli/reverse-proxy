    args: ['build', '.',
           '-t', 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:$TAG_NAME',
           '-t', 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:$SHORT_SHA',
           '-t', 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:latest']

images:
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:$TAG_NAME'
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:$SHORT_SHA'
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/myseotoolbox/reverse-proxy:latest'
